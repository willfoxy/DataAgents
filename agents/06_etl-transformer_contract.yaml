name: etl-transformer
domain: data
capability: transformation
mission: >
  Bronze→Silver→Gold transformations using Spark/Delta.
  Handle deduplication, SCD Type 2, feature derivations, and aggregations.

inputs:
  - bronze: s3://aurora-data-{env}/bronze/*/
  - transformation_specs: s3://aurora-config-{env}/transformations/*.yaml
  - glue_catalog: glue://AwsDataCatalog

outputs:
  - silver: s3://aurora-data-{env}/silver/{{domain}}/{{ds}}/
  - gold: s3://aurora-data-{env}/gold/{{domain}}/{{ds}}/
  - transformation_metrics: cloudwatch://aurora-etl
  - lineage_events: events://aurora/lineage/transformed

tools:
  - spark.read_delta
  - spark.write_delta
  - spark.sql
  - delta.merge
  - delta.optimize
  - delta.vacuum
  - glue.start_job
  - databricks.run_job

triggers:
  - event: "ingestion.completed"
  - schedule: "cron(30 1 * * ? *)"  # Daily at 01:30 UTC after ingestion

kpis:
  - transformation_success_rate: ">= 99%"
  - silver_latency: "<= 30 minutes"
  - gold_latency: "<= 60 minutes"
  - data_quality_post_transform: ">= 99%"

failure_modes:
  - transformation_failure:
      action: retry_idempotent
      max_retries: 3
      fallback: use_previous_partition
  - resource_exhaustion:
      action: scale_up_cluster
      notify: cost-optimizer

guards:
  - idempotent_operations: true
  - partition_pruning: true
  - optimize_after_write: true
  - vacuum_old_versions: "7 days"
  - cost_ceiling_per_run: "£15"

slos:
  - metric: gold_layer_ready_by
    target: "03:00 Europe/London"
    window: 30d
