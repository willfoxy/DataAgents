[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurora-energy-platform"
version = "0.1.0"
description = "Agentic data & analytics platform for Aurora Energy"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Aurora Energy Platform Team", email = "platform@auroraenergy.uk"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-aws>=0.2.0",

    # AWS
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "aioboto3>=12.0.0",

    # Data & ML
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "prophet>=1.1.5",
    "statsmodels>=0.14.0",

    # MLOps
    "mlflow>=2.10.0",
    "sagemaker>=2.210.0",
    "great-expectations>=0.18.0",

    # Delta/Iceberg
    "delta-spark>=3.1.0",
    "pyiceberg>=0.6.0",

    # Data validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # Observability
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "structlog>=24.1.0",

    # Utilities
    "orjson>=3.9.0",
    "rich>=13.7.0",
    "tenacity>=8.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",

    # Cost tracking
    "boto3-cost-explorer>=0.1.0",

    # Databricks
    "databricks-sdk>=0.23.0",

    # Azure
    "azure-ai-ml>=1.14.0",
    "azure-identity>=1.15.0",

    # Time & scheduling
    "pytz>=2024.1",
    "python-dateutil>=2.9.0",
    "croniter>=2.0.0",

    # Security
    "cryptography>=42.0.0",

    # Optimization (for pricing agent)
    "pulp>=2.8.0",
    "cvxpy>=1.4.0",

    # Causal inference
    "dowhy>=0.11",
    "econml>=0.15.0",

    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.19.0",

    # Reporting
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
    "ipython>=8.21.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "faker>=24.0.0",
    "moto>=5.0.0",  # AWS mocking
    "localstack>=3.2.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/auroraenergy/dataagents"
Documentation = "https://docs.auroraenergy.uk/platform"
Repository = "https://github.com/auroraenergy/dataagents"

[tool.hatch.build.targets.wheel]
packages = ["libs", "agents", "pipelines", "apps"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=libs",
    "--cov=agents",
    "--cov=pipelines",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["libs", "agents", "pipelines", "apps"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "great_expectations.*",
    "mlflow.*",
    "sagemaker.*",
    "delta.*",
    "pyiceberg.*",
    "langgraph.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["libs", "agents", "pipelines", "apps"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test_*.py" = ["ARG", "S101"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
